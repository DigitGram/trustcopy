name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04  # GTK 4.14, the oldest supported: ubuntu-latest moves to 26.04 in late 2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - run: pyflakes src tests
      - run: python tests/test_core.py
      - run: shellcheck install.sh tests/scenarios.sh tests/install_test.sh
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-adw-1 xvfb
      - run: xvfb-run -a /usr/bin/python3 tests/smoke_gtk.py  # system Python: it has the GTK bindings
      - run: tests/install_test.sh  # here, not in the container below: install.sh refuses root
      - run: scripts/build-deb.sh "$RUNNER_TEMP" && dpkg-deb -I "$RUNNER_TEMP"/trustcopy_*_all.deb && shellcheck scripts/build-deb.sh

  ubuntu-26-04:  # the newest GNOME we support: newer GTK lays out and newer Python behaves differently from the job above
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive  # tzdata would otherwise ask for a time zone and hang
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-gi python3-gi-cairo gir1.2-adw-1 xvfb xauth gnupg fonts-dejavu-core gsettings-desktop-schemas libglib2.0-bin  # the last two: the GNOME shortcut tests
      - run: python3 tests/test_core.py
      - run: xvfb-run -a python3 tests/smoke_gtk.py

  deb:  # the .deb on a clean system: it must install with its dependencies, start and leave nothing behind
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13"]
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends shellcheck xvfb xauth fonts-dejavu-core
      - run: shellcheck scripts/build-deb.sh
      - run: scripts/build-deb.sh "$RUNNER_TEMP"
      - name: install it; apt pulls in the dependencies
        run: apt-get install -y --no-install-recommends "$RUNNER_TEMP"/trustcopy_*_all.deb
      - name: files and version
        run: |
          test "$(trustcopy --version)" = "TrustCopy $(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' install.sh)"
          test -f /usr/share/applications/io.github.digitgram.TrustCopy.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.digitgram.TrustCopy.png
          test -d /usr/share/trustcopy/__pycache__   # postinst compiled it
      - name: the first start creates the right-click entries, once
        run: |
          export HOME="$(mktemp -d)"
          unset XDG_DATA_HOME XDG_CONFIG_HOME
          cd /usr/share/trustcopy
          python3 -I -c "import sys; sys.path.insert(0, '.'); import desktop; assert desktop.PACKAGED and desktop.first_run_entries() and not desktop.first_run_entries()"
          ls "$HOME/.local/share/nautilus/scripts"/TrustCopy* >/dev/null
      - name: remove and purge leave nothing behind
        run: |
          apt-get remove -y trustcopy
          test ! -e /usr/share/trustcopy
          test ! -e /usr/bin/trustcopy
          apt-get purge -y trustcopy
          ! dpkg -s trustcopy 2>/dev/null
